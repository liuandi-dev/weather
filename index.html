<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌤️ 天气</title>
  <link rel="stylesheet" href="style.css">
</head>
<!-- body 的类由 script.js 根据天气换（bg-sunny / bg-rain / bg-snow...） -->
<body class="bg-default">

  <header>
    <h1>🌤️ 天气</h1>
    <p class="subtitle" id="city-name">搜索一个城市开始</p>
  </header>

  <main>
    <!-- ② 搜城市：输入 → 候选列表 → 点选 -->
    <section class="card">
      <div class="search-row">
        <input id="city-input" type="text" placeholder="输入城市名，如：北京 / 上海 / 成都">
        <button id="search-btn" class="btn-primary">搜索</button>
      </div>
      <p id="hint" class="hint"></p>
      <div id="city-list" class="city-list"></div>
    </section>

    <!-- ① 当前天气 -->
    <section class="card current-card" id="current-card" style="display:none">
      <p class="now-label">现在</p>
      <div class="now-main">
        <span class="now-icon" id="now-icon">☀️</span>
        <span class="now-temp" id="now-temp">--°</span>
      </div>
      <p class="now-desc" id="now-desc"></p>
      <p class="advice" id="advice"></p>
    </section>

    <!-- ① 未来预报 -->
    <section class="card" id="forecast-card" style="display:none">
      <h2>未来几天</h2>
      <div class="forecast" id="forecast"></div>
    </section>
  </main>

  <footer>
    <a href="https://liuandi-dev.github.io/homepage/" target="_blank">← 回我的主页</a>
    <p>Andy · 100 项目挑战 · 数据来自 Open-Meteo（免费公开 API）</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
